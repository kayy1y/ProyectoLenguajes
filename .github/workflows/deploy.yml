# Despliegue manual (botón "Run workflow"): el servidor descarga de GHCR la
# versión indicada y reinicia los servicios. Requiere los secrets DEPLOY_HOST,
# DEPLOY_USER y DEPLOY_SSH_KEY (ver docs/deployment.md).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Etiqueta de imagen a desplegar (latest, sha-xxxxxxx o una versión)"
        required: true
        default: latest

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Pull and restart on the server
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/gamestats
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${IMAGE_TAG}/" .env
            docker compose -f docker-compose.deploy.yml pull
            docker compose -f docker-compose.deploy.yml up -d --wait
            curl -fsS http://localhost:8080/healthz
      - name: Check from outside
        run: curl -fsS --retry 5 --retry-delay 3 "http://${{ secrets.DEPLOY_HOST }}:8080/healthz"
