name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [ingestion-go, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Sin formato:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go build ./...
      - name: go test -race
        run: go test -race -count=1 ./...

  scala:
    name: Scala (analytics-scala)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-scala
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: sbt test assembly
        run: sbt -batch test assembly

  gui:
    name: Desktop app (${{ matrix.os }})
    needs: [go]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: simulator/go.mod
          cache-dependency-path: simulator/go.sum
      - name: Install OpenGL and X11 headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - run: go vet -tags gui ./cmd/gui
      - name: Window smoke test
        run: go test -tags gui -count=1 -run TestWindowBuildsWithoutIngestion ./cmd/gui
      - name: Build executable
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go build -tags gui -trimpath -ldflags="-H=windowsgui" -o ../bin/gamestats-gui.exe ./cmd/gui
          else
            go build -tags gui -trimpath -o ../bin/gamestats-gui ./cmd/gui
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: gamestats-gui-${{ runner.os }}
          path: bin/

  docker:
    name: Docker images
    needs: [go, scala]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion-go, analytics-scala, simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e:
    name: End-to-end (Docker Compose)
    needs: [go, scala]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run e2e suite
        run: ./tests/e2e/e2e.sh
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: e2e-logs.txt
          if-no-files-found: ignore
