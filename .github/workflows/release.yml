# Entrega continua de artefactos: publica las imágenes en GHCR (multi-arch).
# El despliegue en el servidor es un paso aparte (deploy.yml o manual, ver docs/deployment.md).
name: Release images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gamestats-ingestion
            dockerfile: ingestion-go/Dockerfile
          - image: gamestats-analytics
            dockerfile: analytics-scala/Dockerfile
          - image: gamestats-simulator
            dockerfile: simulator/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

  render:
    name: Redeploy on Render
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Opcional: si existen los secrets con los Deploy Hooks de Render, cada push a main
      # vuelve a desplegar las imágenes recién publicadas. Sin secrets, el job no hace nada.
      - name: Trigger Render deploy hooks
        env:
          HOOK_ANALYTICS: ${{ secrets.RENDER_DEPLOY_HOOK_ANALYTICS }}
          HOOK_INGESTION: ${{ secrets.RENDER_DEPLOY_HOOK_INGESTION }}
        run: |
          if [ -z "$HOOK_ANALYTICS" ] && [ -z "$HOOK_INGESTION" ]; then
            echo "No hay deploy hooks de Render configurados: se omite."
            exit 0
          fi
          if [ -n "$HOOK_ANALYTICS" ]; then curl -fsS -X POST "$HOOK_ANALYTICS" > /dev/null && echo "analytics: redeploy solicitado"; fi
          if [ -n "$HOOK_INGESTION" ]; then curl -fsS -X POST "$HOOK_INGESTION" > /dev/null && echo "ingestion: redeploy solicitado"; fi
